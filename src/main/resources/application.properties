spring.application.name=apiRedDePatas

# Server
server.port=8085
server.servlet.context-path=/api-red-patas

# Oracle Database
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xe
spring.datasource.username=MSIRDP
spring.datasource.password=123456
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=RedPatasPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration
app.jwt.secret=RedDePatasSecretKeyMunicipalidadSanIsidro2024JWT
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Logging
logging.level.root=INFO
logging.level.pe.gob.msi.apiRedDePatas=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html